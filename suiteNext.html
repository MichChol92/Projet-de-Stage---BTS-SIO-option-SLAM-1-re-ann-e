<html>
  <head>
    <title>Découvrir le NEXT</title>
    <link rel="stylesheet" type="text/css" href="css/suiteCSS.css" />
  </head>

  <body>
    <h2 id="titre"></h2>

    <div class="logo">
      <img
        align="right"
        src="./images/page_login/logo.png"
        style="width: 150px; height: 150px"
      />
    </div>

    <div class="conteneur_image">
      <span class="SpanImage1">
        <img class="ImageGauche" id="ImageGauche" />
      </span>

      <button id="boutonGauche" class="BoutonGauche" onclick="precedent()">
        <img class="LaGauche" src="./images/page_next/fleche_gauche.png" />
      </button>

      <span class="SpanImage2">
        <img class="ImageCentre" id="ImageCentre" />
      </span>

      <button id="boutonDroite" class="BoutonDroite" onclick="suivant()">
        <img class="LaDroite" src="./images/page_next/fleche_droite.png" />
      </button>

      <span class="SpanImage3">
        <img class="ImageDroite" id="ImageDroite" />
      </span>
    </div>

    <button class="back">
      <a href="AccueilV2.html">Retour à la page d'accueil</a>
    </button>

    <script>
      // Tableau des images
      const images = [
        { src: "./images/page_next/4thfloor.png", nom: "Étage 4" },
        { src: "./images/page_next/5thfloor.jpg", nom: "Étage 5" },
        { src: "./images/page_next/6thfloor.jpg", nom: "Étage 6" },
      ];

      let index = 0;

      // Fonction principale d'affichage
      function afficher() {
        // Image centrale
        document.getElementById("ImageCentre").src = images[index].src;
        document.getElementById("titre").innerText = images[index].nom;

        // Image gauche (circulaire)
        let indexGauche = (index - 1 + images.length) % images.length;
        document.getElementById("ImageGauche").src = images[indexGauche].src;

        // Image droite (circulaire)
        let indexDroite = (index + 1) % images.length;
        document.getElementById("ImageDroite").src = images[indexDroite].src;
      }

      // Bouton suivant (boucle infinie)
      function suivant() {
        index = (index + 1) % images.length;
        afficher();
      }

      // Bouton précédent (boucle infinie)
      function precedent() {
        index = (index - 1 + images.length) % images.length;
        afficher();
      }

      // Initialisation
      afficher();
    </script>
  </body>
</html>
